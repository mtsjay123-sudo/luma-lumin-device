# Builds Luma Desktop on real Macs and Windows, checks that first launch really works
# there (private Python, Luma's tools, a browser, Luma answering), and publishes the
# installers as a GitHub Release with stable names the website links to:
#   https://github.com/<owner>/<repo>/releases/latest/download/Luma-mac-apple-silicon.dmg
name: Luma Desktop

on:
  push:
    paths:
      - "desktop/**"
      - "Luma Home Prototype Code/src/**"
      - "Luma Home Prototype Code/scripts/**"
      - ".github/workflows/luma-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: First launch works on a real Mac
        run: node scripts/smoke.js "$RUNNER_TEMP/luma-home"
      # With the Apple Developer secrets set, the app is signed and notarized, so macOS opens it
      # with no warning. Without them it's ad-hoc signed (people click Open Anyway once).
      - name: Build for Mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Signing with the Developer ID and notarizing with Apple."
            npx electron-builder --mac --publish never --config notarize.config.js
          else
            echo "No Apple Developer secrets yet: ad-hoc signed build."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run dist:mac
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-for-Mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  # Project code runs inside Apple's sandbox on a Mac. This proves the fence on a real Mac: code can write
  # its own project folder and nothing else, can't read the owner's files, and has no network.
  work-sandbox:
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "Luma Home Prototype Code"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "cryptography>=42" pytest
      - name: The sandbox fences project code in
        run: PYTHONPATH=src:tests python -m pytest -v -p no:cacheprovider tests/test_work_foundation.py -k "Sandbox or Project"

  # Luma's voices, rendered on a real Apple Silicon Mac: the classic voice with the new conversation
  # layer, the new open-source voices (Chatterbox-Turbo, Qwen3-TTS) learning Luma's voice, and candidate
  # designs for Luma's own voice. Download "Luma-voice-samples" from the run to listen. Never blocks a release.
  voice:
    # Once per commit (main), one at a time: the same commit on the work branch would only wait in line for the same Macs.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: voice-lab
      cancel-in-progress: false
    runs-on: macos-14
    timeout-minutes: 120
    continue-on-error: true
    defaults:
      run:
        working-directory: "Luma Home Prototype Code"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The voice tools Luma installs on a Mac
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mlx-audio==0.6.1" "kokoro-onnx>=0.4,<1" numpy
      - name: Luma's classic voice
        run: |
          mkdir -p models/kokoro-82m
          curl -fsSL -o models/kokoro-82m/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -fsSL -o models/kokoro-82m/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Render the samples
        env:
          LUMA_NATURAL_DIR: ${{ runner.temp }}/natural
          TQDM_DISABLE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: LUMA_VOICE_PYTHON="$(which python)" python scripts/voice_samples.py "$RUNNER_TEMP/voice-samples"
      - name: Voice log
        if: always()
        run: tail -n 80 "$RUNNER_TEMP/natural/voice.log" || true
      - name: Check by ear (Whisper hears each sample) and rank how human each voice sounds (UTMOSv2)
        if: always()
        run: |
          python -m venv "$RUNNER_TEMP/stt"
          "$RUNNER_TEMP/stt/bin/python" -m pip install -q "faster-whisper==1.2.1"
          "$RUNNER_TEMP/stt/bin/python" -m pip install -q "git+https://github.com/sarulab-speech/UTMOSv2.git" || echo "UTMOSv2 didn't install; words only"
          printf 'verbose = off\n' > "$RUNNER_TEMP/wgetrc"  # the ranking model's weights download quietly, so the results stay readable
          WGETRC="$RUNNER_TEMP/wgetrc" "$RUNNER_TEMP/stt/bin/python" -I scripts/voice_check.py "$RUNNER_TEMP/voice-samples" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Luma-voice-samples
          path: ${{ runner.temp }}/voice-samples
          if-no-files-found: warn

  # Luma's lab on a real Apple Silicon Mac with real internet: how fast each brain size talks, 50 conversations built
  # to tempt it into making things up, and the 10 everyday jobs run again and again. Doesn't hold up the release.
  brain-lab:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: brain-lab
      cancel-in-progress: false
    runs-on: macos-14
    timeout-minutes: 170
    continue-on-error: true
    defaults:
      run:
        working-directory: "Luma Home Prototype Code"
    env:
      TQDM_DISABLE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The packages Luma Desktop installs
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary "cryptography>=44" "qrcode==8.2" "python-pptx>=1.0,<2" "playwright>=1.56,<2" numpy python-dotenv tzdata "python-docx>=1.1,<2" "openpyxl>=3.1,<4" "pypdf>=4,<7"
          python -m pip install --prefer-binary --only-binary llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/metal "llama-cpp-python>=0.3.9" \
            || CMAKE_ARGS="-DGGML_METAL=on" python -m pip install --no-binary llama-cpp-python "llama-cpp-python>=0.3.9"
          python -m playwright install chromium
      - name: Speed by brain size (small, the one Luma ships, bigger)
        run: |
          mkdir -p "$RUNNER_TEMP/brains" "$RUNNER_TEMP/lab"
          get() { curl -fsSL --retry 3 -o "$RUNNER_TEMP/brains/$1" "$2" || echo "couldn't download $1"; }
          get small.gguf "https://huggingface.co/bartowski/Qwen_Qwen3-1.7B-GGUF/resolve/main/Qwen_Qwen3-1.7B-Q4_K_M.gguf"
          get luma.gguf "https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/ae44f08e1392f39c0e474af10c3ff8355c8b6688/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          args=""; for b in small luma; do [ -f "$RUNNER_TEMP/brains/$b.gguf" ] && args="$args --model $RUNNER_TEMP/brains/$b.gguf"; done
          python scripts/luma_lab.py speed $args --save "$RUNNER_TEMP/lab/speed.json"
          rm -f "$RUNNER_TEMP/brains/small.gguf"
          get big.gguf "https://huggingface.co/bartowski/Qwen_Qwen3-8B-GGUF/resolve/main/Qwen_Qwen3-8B-Q4_K_M.gguf"
          [ -f "$RUNNER_TEMP/brains/big.gguf" ] && python scripts/luma_lab.py speed --model "$RUNNER_TEMP/brains/big.gguf" --save "$RUNNER_TEMP/lab/speed-big.json" || true
          rm -f "$RUNNER_TEMP/brains/big.gguf"
      - name: Always-on feeds with real internet (news, culture, YouTube, Reddit, prices)
        if: always()
        run: python scripts/luma_lab.py pulse --save "$RUNNER_TEMP/lab/pulse.json"
      - name: Honesty, 50 conversations
        if: always()
        env:
          LUMA_MODEL_PATH: ${{ runner.temp }}/brains/luma.gguf
        run: python scripts/luma_lab.py honesty --save "$RUNNER_TEMP/lab/honesty.json"
      - name: The 10 everyday jobs, with real internet
        if: always()
        env:
          LUMA_MODEL_PATH: ${{ runner.temp }}/brains/luma.gguf
        run: python scripts/luma_lab.py jobs --repeats 10 --slow-repeats 2 --save "$RUNNER_TEMP/lab/jobs.json"
      - name: Summary
        if: always()
        run: python scripts/luma_lab.py summary "$RUNNER_TEMP"/lab/*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Luma-lab
          path: ${{ runner.temp }}/lab
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: First launch works on a real Windows PC
        run: node scripts/smoke.js "$RUNNER_TEMP/luma-home"
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-for-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/hopeful-feynman-z2294x'
    runs-on: ubuntu-latest
    # One release at a time: two pushes close together used to publish and prune releases at once, and one failed.
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Give the files names that never change
        run: |
          mkdir out
          cp dist/Luma-for-Mac/*-mac-arm64.dmg out/Luma-mac-apple-silicon.dmg
          cp dist/Luma-for-Mac/*-mac-x64.dmg out/Luma-mac-intel.dmg
          cp dist/Luma-for-Mac/*-mac-arm64.zip out/Luma-mac-apple-silicon.zip
          cp dist/Luma-for-Mac/*-mac-x64.zip out/Luma-mac-intel.zip
          cp dist/Luma-for-Windows/*.exe out/Luma-windows-setup.exe
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.2.${{ github.run_number }}"
          cat > notes.md <<'NOTES'
          Luma Desktop: your own AI that works for you, running privately on your computer.

          **Mac:** open the .dmg and drag Luma to Applications. If macOS says Apple cannot check it for malicious software, open System Settings → Privacy & Security and click Open Anyway, once. Or install from Terminal with no warning: `curl -fsSL https://lumin-holdings-site.vercel.app/install-mac.sh | bash`.
          **Windows:** run the installer. If SmartScreen appears, choose More info → Run anyway.

          On first launch Luma sets itself up in its own folder: a private Python, its tools, and its brain (Qwen3 4B, about 2.5 GB, checked against its published SHA-256). Nothing is sent or bought without your OK.
          NOTES
          # A newer push to this branch publishes its own build; an older run never becomes "latest".
          # (Publishing a build of a commit that is no longer the branch head is also what GitHub refused with a 403.)
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" -q .sha 2>/dev/null || echo "$GITHUB_SHA")"
          if [ "$head" != "$GITHUB_SHA" ]; then echo "A newer push is on $GITHUB_REF_NAME and will publish; skipping this build."; exit 0; fi
          gh release create "desktop-v$version" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Luma Desktop $version" --notes-file notes.md --latest
          # Keep the three newest desktop releases.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName -q '.[].tagName' \
            | grep '^desktop-v' | tail -n +4 \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
