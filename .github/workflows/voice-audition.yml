# The same eight lines in every voice that can be tried, so the owner can judge them by ear
# (Luma Home Prototype Code/scripts/voice_audition.py). GitHub's machines can fetch the models; the cloud session that
# writes Luma's code can't. Each voice is one job; the recordings are committed to demo/voices/ on the branch it ran
# on, with [skip ci]. Free machines; nothing is billed. It runs when the script or this file changes on the working
# branch (a dispatch needs the file on main, which doesn't move).
name: Voice audition

on:
  push:
    branches: [claude/hopeful-feynman-z2294x]
    paths:
      - "Luma Home Prototype Code/scripts/voice_audition.py"
      - ".github/workflows/voice-audition.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-audition
  cancel-in-progress: true

jobs:
  say:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        engine: [kokoro, chatterbox, chatterbox-turbo]
    defaults:
      run:
        working-directory: "Luma Home Prototype Code"
    env:
      TQDM_DISABLE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: What every voice needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary "cryptography>=44" python-dotenv tzdata
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
      - name: The classic voice (Kokoro, Apache-2.0)
        if: matrix.engine == 'kokoro'
        run: |
          python -m pip install --prefer-binary "kokoro-onnx>=0.4,<1"
          mkdir -p models/kokoro-82m
          K=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fsSL --retry 3 -o models/kokoro-82m/kokoro-v1.0.int8.onnx "$K/kokoro-v1.0.int8.onnx"
          curl -fsSL --retry 3 -o models/kokoro-82m/voices-v1.0.bin "$K/voices-v1.0.bin"
      - name: Chatterbox (Resemble AI, MIT), on the CPU
        if: matrix.engine != 'kokoro'
        run: |
          python -m pip install --prefer-binary torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --prefer-binary chatterbox-tts
      - name: The eight lines
        run: python scripts/voice_audition.py --engine "${{ matrix.engine }}" --out "$RUNNER_TEMP/voices" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: As an mp3
        run: ffmpeg -loglevel error -y -i "$RUNNER_TEMP/voices/${{ matrix.engine }}.wav" -codec:a libmp3lame -q:a 3 "$RUNNER_TEMP/voices/${{ matrix.engine }}.mp3" && rm "$RUNNER_TEMP/voices/${{ matrix.engine }}.wav"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.engine }}
          path: ${{ runner.temp }}/voices

  keep:
    needs: say
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # enough history to merge the recordings onto the branch if it moved while this ran
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/voices
          pattern: voice-*
          merge-multiple: true
      - name: Into demo/voices/ on this branch, where they can be listened to
        run: |
          ls -la "$RUNNER_TEMP/voices" || exit 0
          mkdir -p demo/voices && cp "$RUNNER_TEMP"/voices/*.mp3 "$RUNNER_TEMP"/voices/*.md demo/voices/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/voices
          git diff --cached --quiet && exit 0
          git commit -q -m "The same eight lines in each voice, to be judged by ear (${GITHUB_SHA::7}) [skip ci]"
          for i in 1 2 3; do git pull -q --no-rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
