# The brain contest: which open brain is best for Luma, measured with Luma's own tests.
#
# The owner, Nov 25: "Find the very best open source." Rankings on the web are for coding and exams. This runs each
# candidate through Luma's whole layer on the same questions, beside the brain Luma uses today (stock Qwen3 4B):
# the safety net, and the conversations of Human Test v2.
#
# Rule 7: a candidate's license is read from its maker's own page before anything is fetched, and it isn't run unless
# that says MIT, Apache-2.0 or BSD (scripts/brain_contest.py). Rule 9: the one file fetched goes in a folder of its own.
# Nothing is published and nothing in Luma changes: this prints numbers.
#
# What it can't say: a 27B-class brain doesn't fit these machines (16 GB, no graphics chip). That one is for the Mac.
# The candidates' names came from web searches on Nov 25, 2026; a name that's wrong shows up here as "not run".
#
# Round 1 (Nov 25, run 45713370816): today's Qwen3 4B 95 of 115 conversations, Gemma 4 E4B 102 (in about half the
# time), nobody claimed to be human. Qwen3.5 4B and 9B didn't count: their chat template refused Luma's second system
# message and every reply was that error (fixed in src/luma/llm/inference.py). Phi-4 mini and Gemma 4 12B: see the run.
# Round 2 (Nov 26, run 45736890810): the two that were close, twice each: Gemma 4 E4B 200 of 230 in 96 minutes, today's
# Qwen3 4B 190 of 230 in 152. With round 1 that's 302 against 285 of 345: a gap that turns up about 9 times in 100 by
# chance, so not a lead by the rule, though it's the same way round on every pass. On Luma's safety question Gemma 4 E4B
# caught 43 of 48 held-out lines against 32 (about 1 in 100 by chance). Qwen3.5 4B hadn't finished one pass in three
# hours on the fixed code: whatever it scores, a turn is far slower.
# Round 3 (this file): the gate the rule names before anything ships, for the one candidate still standing and today's
# brain, side by side: the whole of Human Test v2, the 10-moment test and the month test (both halves, numbers only).
# Written before the run: Gemma 4 E4B is good enough to put to the owner only if the whole test is no lower than
# today's brain's on this run, the not-safe moments are all caught, nobody claims to be human or makes up a life, the
# 10-moment test and the month test are no lower, and a turn is no slower. Nothing in Luma is switched by this run.
#
# It runs when its script or this file changes on the working branch (a dispatch needs the file on main, which doesn't
# move). Free machines; nothing is billed.
name: Brain contest

on:
  push:
    branches: [claude/hopeful-feynman-z2294x]
    paths:
      - "Luma Home Prototype Code/scripts/brain_contest.py"
      - ".github/workflows/brain-contest.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Which moments of Human Test v2 (an id or kind that contains this word; empty: the whole test)"
        default: ""

permissions:
  contents: read

# One run per commit: a second round doesn't stop the first (round 1's 12B was still answering when round 2 began).
concurrency:
  group: brain-contest-${{ github.sha }}
  cancel-in-progress: true

env:
  TQDM_DISABLE: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  LUMA_THREADS: "4"
  LUMA_DEVICE_TIER: budget

jobs:
  talk:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: qwen3-4b
            what: whole
            label: "Qwen3 4B (today's brain)"
            official: Qwen/Qwen3-4B-Instruct-2507
            gguf: "bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF"
            quant: "Q4_0"
          - key: qwen3-4b
            what: month
            label: "Qwen3 4B (today's brain)"
            official: Qwen/Qwen3-4B-Instruct-2507
            gguf: "bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF"
            quant: "Q4_0"
          - key: gemma4-e4b
            what: whole
            label: "Gemma 4 E4B"
            official: google/gemma-4-E4B-it
            gguf: "unsloth/gemma-4-E4B-it-GGUF,bartowski/google_gemma-4-E4B-it-GGUF,lmstudio-community/gemma-4-E4B-it-GGUF,ggml-org/gemma-4-E4B-it-GGUF"
            quant: "Q4_0,Q4_K_M"
          - key: gemma4-e4b
            what: month
            label: "Gemma 4 E4B"
            official: google/gemma-4-E4B-it
            gguf: "unsloth/gemma-4-E4B-it-GGUF,bartowski/google_gemma-4-E4B-it-GGUF,lmstudio-community/gemma-4-E4B-it-GGUF,ggml-org/gemma-4-E4B-it-GGUF"
            quant: "Q4_0,Q4_K_M"
          # Ran in rounds 1 and 2 and not again here: gemma4-12b (google/gemma-4-12B-it), phi4-mini
          # (microsoft/Phi-4-mini-instruct), qwen35-4b (Qwen/Qwen3.5-4B) and qwen35-9b (Qwen/Qwen3.5-9B).
    defaults:
      run:
        working-directory: "Luma Home Prototype Code"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Its license, read from its maker's page, and the one file to fetch
        run: python -I scripts/brain_contest.py find --official "${{ matrix.official }}" --gguf "${{ matrix.gguf }}" --quant "${{ matrix.quant }}"
      - name: Luma's packages, and the newest engine (the new brains need it)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary "cryptography>=44" "qrcode==8.2" "python-pptx>=1.0,<2" numpy python-dotenv tzdata \
            "python-docx>=1.1,<2" "openpyxl>=3.1,<4" "pypdf>=4,<7"
          CMAKE_ARGS="-DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16" \
            python -m pip install --no-binary llama-cpp-python llama-cpp-python
          python -m pip show llama-cpp-python | grep -i -E "^(version|license)"
      - name: The brain, in a folder of its own
        run: |
          mkdir -p "$RUNNER_TEMP/brains"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/brains/$BRAIN_FILE" "$BRAIN_URL"
          ls -la "$RUNNER_TEMP/brains"
          echo "LUMA_MODEL_PATH=$RUNNER_TEMP/brains/$BRAIN_FILE" >> "$GITHUB_ENV"
          echo "LABEL=${{ matrix.label }} [$BRAIN_LICENSE]" >> "$GITHUB_ENV"
      - name: The safety net
        if: matrix.what == 'whole'
        run: |
          mkdir -p "$RUNNER_TEMP/v2"
          python scripts/human_eval.py safety --label "$LABEL" --save "$RUNNER_TEMP/v2/safety-${{ matrix.key }}.json"
      - name: The whole of Human Test v2, through Luma's whole layer
        if: matrix.what == 'whole'
        env:
          KIND: ${{ inputs.only }}
        run: |
          mkdir -p "$RUNNER_TEMP/v2"
          if [ -n "$KIND" ] && [ "$KIND" != everything ]; then
            python scripts/human_eval.py run --label "$LABEL" --only "$KIND" --save "$RUNNER_TEMP/v2/v2-${{ matrix.key }}.json"
          else
            python scripts/human_eval.py run --label "$LABEL" --save "$RUNNER_TEMP/v2/v2-${{ matrix.key }}.json"
          fi
      - name: The 10-moment test (the device lab's conversation)
        if: matrix.what == 'month'
        run: |
          mkdir -p "$RUNNER_TEMP/v2"
          timeout 40m python scripts/luma_lab.py device --threads 4 --human --label "$LABEL" --save "$RUNNER_TEMP/v2/device-${{ matrix.key }}.json" || true
      - name: The month test (is Luma better with someone on day 28 than on day 1), both halves, numbers only
        if: matrix.what == 'month'
        run: |
          mkdir -p "$RUNNER_TEMP/v2"
          python scripts/month_eval.py run --split dev --lives 6 --brain --label "$LABEL" --save "$RUNNER_TEMP/v2/month-${{ matrix.key }}.json"
          # the lives nothing was built on: the script saves no line of theirs and prints no miss
          python scripts/month_eval.py run --split heldout --lives 6 --brain --label "$LABEL" --save "$RUNNER_TEMP/v2/month-heldout-${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-${{ matrix.key }}-${{ matrix.what }}
          path: ${{ runner.temp }}/v2

  report:
    needs: [talk]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Luma Home Prototype Code"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --prefer-binary "cryptography>=44" numpy tzdata
      - uses: actions/download-artifact@v4
        with:
          pattern: "v2-*"
          merge-multiple: true
          path: ${{ runner.temp }}/all
      - name: "The table (a brain that isn't in it wasn't run; its own job says why)"
        run: |
          cd "$RUNNER_TEMP/all"
          files="$(ls v2-*.json safety-*.json 2>/dev/null | tr '\n' ' ')"
          if [ -n "$(echo $files)" ]; then
            python "$GITHUB_WORKSPACE/Luma Home Prototype Code/scripts/human_eval.py" summary $files | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No brain finished the whole test."
          fi
          device="$(ls device-*.json 2>/dev/null | tr '\n' ' ')"
          if [ -n "$device" ]; then
            python "$GITHUB_WORKSPACE/Luma Home Prototype Code/scripts/luma_lab.py" device-summary $device | awk '/<details>/{skip=1} !skip' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          month="$(ls month-*.json 2>/dev/null | tr '\n' ' ')"
          if [ -n "$month" ]; then
            python "$GITHUB_WORKSPACE/Luma Home Prototype Code/scripts/month_eval.py" summary $month | tee -a "$GITHUB_STEP_SUMMARY"
          fi
