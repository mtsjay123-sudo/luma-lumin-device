<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'" />
  <title>Luma</title>
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <div class="scene" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <main>
    <div class="orb" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 id="title">Waking up</h1>
    <p class="lede" id="detail">Starting Luma on this computer.</p>

    <section class="progress glass" id="progress" hidden aria-live="polite">
      <div class="row"><span id="step-label">Getting ready</span><span id="percent">0%</span></div>
      <div class="bar"><i id="fill"></i></div>
      <ol class="steps" id="setup">
        <li data-step="python">Python</li>
        <li data-step="packages">Tools</li>
        <li data-step="browser">Browser</li>
        <li data-step="model">Brain</li>
        <li data-step="voice">Voice</li>
      </ol>
      <p class="fine" id="fine">About 3 GB, once. Everything stays on this computer, and closing Luma just pauses it.</p>
    </section>

    <div class="actions" id="actions" hidden>
      <button id="retry" class="primary">Try again</button>
      <button id="repair">Repair Luma</button>
      <button id="choose">Use my Luma folder</button>
    </div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
