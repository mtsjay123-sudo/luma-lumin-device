<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Luma</title>
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <main>
    <div class="glow" aria-hidden="true"></div>
    <img class="mascot" src="assets/logo.svg" alt="" width="104" height="104" />
    <h1 id="title">Waking up…</h1>
    <p id="detail">Starting Luma's brain on this computer. The first time takes a minute.</p>
    <div class="actions" id="actions" hidden>
      <button id="choose" class="primary">Find Luma's folder</button>
      <button id="retry">Try again</button>
    </div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
