[project]
name = "luma"
version = "0.1.0"
description = "Ambient AI companion device software stack"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
dependencies = [
    "llama-cpp-python",
    "faster-whisper",
    "sounddevice",
    "numpy",
    "sqlite-vec",
    "sentence-transformers",
    "librosa",
    "scikit-learn",
    "python-dotenv",
    "pynput",
    "silero-vad",
    "kokoro-onnx",
    "livekit>=1.0",  # WebRTC echo cancellation, so the owner can talk over Luma on a plain speaker
    "markitdown[docx,pptx,xlsx]>=0.1",  # Office files as Markdown: tables stay tables
    "trafilatura>=2.0",  # a web page down to its article
    "onnxruntime",  # Smart Turn (and Kokoro): small models that run on the CPU
    "httpx",
    "feedparser",
    "wikipedia-api",
    "cryptography>=44",
    "qrcode==8.2",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# PDFs read with their layout and tables (IBM's Docling, MIT). Large: it brings PyTorch and downloads its layout models once.
documents = ["docling>=2"]
# Pitch decks and Luma's browser. Run `python -m playwright install chromium` once after installing.
agent = ["python-pptx>=1.0,<2", "playwright>=1.56,<2"]

[project.scripts]
luma = "luma.cli:main"

[tool.pytest.ini_options]
markers = ["integration: requires local audio or model files"]

[tool.setuptools.package-data]
"luma.control" = ["web/*.html", "web/*.css", "web/*.js", "web/desktop/*", "web/desktop/brand/*", "web/desktop/fonts/*", "web/desktop/characters/*"]
