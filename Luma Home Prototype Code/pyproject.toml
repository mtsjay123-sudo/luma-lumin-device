[project]
name = "luma"
version = "0.1.0"
description = "Ambient AI companion device software stack"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
dependencies = [
    "llama-cpp-python",
    "faster-whisper",
    "sounddevice",
    "numpy",
    "sqlite-vec",
    "sentence-transformers",
    "librosa",
    "scikit-learn",
    "python-dotenv",
    "pynput",
    "silero-vad",
    "kokoro-onnx",
    "httpx",
    "feedparser",
    "wikipedia-api",
    "cryptography>=44",
]

[project.scripts]
luma = "luma.cli:main"

[tool.pytest.ini_options]
markers = ["integration: requires local audio or model files"]

[tool.setuptools.package-data]
"luma.control" = ["web/*.html", "web/*.css", "web/*.js"]
